name: validate-gitops
on:
  pull_request:
  push: {branches: [main]}
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.18.6}
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: '3.3'}
      - run: ./scripts/validate.sh
      - name: Validate standard Kubernetes resources
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD:/workdir" ghcr.io/yannh/kubeconform:v0.7.0
          -strict -ignore-missing-schemas -summary
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          /workdir/bootstrap /workdir/projects /workdir/applications
      - name: Validate workflow syntax
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
