name: reusable-component-ci
on:
  workflow_call:
    inputs:
      runtime: {description: go or node, required: true, type: string}
      runtime-version: {required: true, type: string}
      working-directory: {required: false, default: ., type: string}
      lint-command: {required: true, type: string}
      test-command: {required: true, type: string}
      dockerfile: {required: false, default: Dockerfile, type: string}
      image-name: {required: true, type: string}
      chart-path: {required: true, type: string}
      component: {description: GitOps application/value filename without extension, required: true, type: string}
      publish: {required: false, default: false, type: boolean}
    secrets:
      GITOPS_APP_ID: {required: false}
      GITOPS_APP_PRIVATE_KEY: {required: false}
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: inputs.runtime == 'go'
        with: {go-version: '${{ inputs.runtime-version }}', cache: true}
      - uses: actions/setup-node@v4
        if: inputs.runtime == 'node'
        with: {node-version: '${{ inputs.runtime-version }}', cache: npm, cache-dependency-path: '${{ inputs.working-directory }}/package-lock.json'}
      - if: inputs.runtime == 'node'
        working-directory: ${{ inputs.working-directory }}
        run: npm ci
      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        env: {LINT_COMMAND: '${{ inputs.lint-command }}'}
        run: bash -euo pipefail -c "$LINT_COMMAND"
      - name: Unit tests
        working-directory: ${{ inputs.working-directory }}
        env: {TEST_COMMAND: '${{ inputs.test-command }}'}
        run: bash -euo pipefail -c "$TEST_COMMAND"
      - uses: azure/setup-helm@v4
        with: {version: v3.18.6}
      - name: Lint Helm chart
        run: helm lint '${{ inputs.chart-path }}'

  build-and-publish:
    needs: lint-and-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Create immutable version
        shell: bash
        run: echo "version=0.1.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}'}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile }}
          push: ${{ inputs.publish }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: azure/setup-helm@v4
        if: inputs.publish
        with: {version: v3.18.6}
      - name: Publish OCI Helm chart
        if: inputs.publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
        run: |
          printf '%s' '${{ github.token }}' | helm registry login ghcr.io --username '${{ github.actor }}' --password-stdin
          helm dependency build '${{ inputs.chart-path }}'
          helm package '${{ inputs.chart-path }}' --version "$VERSION" --app-version "$VERSION" --destination '${{ runner.temp }}'
          helm push '${{ runner.temp }}'/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  update-dev-gitops:
    if: inputs.publish
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: obs-gitops-pipelines
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/obs-gitops-pipelines
          token: ${{ steps.app-token.outputs.token }}
      - name: Pin chart and image in dev
        env:
          VERSION: ${{ needs.build-and-publish.outputs.version }}
          COMPONENT: ${{ inputs.component }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e VERSION -v "$PWD:/workdir" mikefarah/yq:4.45.4 \
            -i '.spec.sources[0].targetRevision = strenv(VERSION)' "applications/dev/${COMPONENT}.yaml"
          docker run --rm --user "$(id -u):$(id -g)" -e VERSION -v "$PWD:/workdir" mikefarah/yq:4.45.4 \
            -i '.image.tag = strenv(VERSION)' "values/dev/${COMPONENT}.yaml"
      - id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: release/dev/${{ inputs.component }}-${{ needs.build-and-publish.outputs.version }}
          delete-branch: true
          commit-message: "release(dev): ${{ inputs.component }} ${{ needs.build-and-publish.outputs.version }}"
          title: "release(dev): ${{ inputs.component }} ${{ needs.build-and-publish.outputs.version }}"
          body: |
            Immutable image and OCI chart produced by `${{ github.repository }}@${{ github.sha }}`.
            Image digest: `${{ needs.build-and-publish.outputs.digest }}`
          labels: release,environment/dev
      - name: Enable auto-merge after required checks
        if: steps.pull-request.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: gh pr merge "$PR_URL" --auto --squash
