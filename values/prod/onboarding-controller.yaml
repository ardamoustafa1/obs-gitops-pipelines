replicaCount: 3
image: {repository: ghcr.io/acme/obs-onboarding-controller, tag: 1.0.0, pullPolicy: IfNotPresent}
existingSecret: obs-onboarding-controller
resources:
  requests: {cpu: 500m, memory: 512Mi}
  limits: {cpu: "2", memory: 2Gi}
rollout:
  enabled: true
  strategy: canary
  canary:
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - {setWeight: 5}
      - {pause: {duration: 10m}}
      - analysis:
          templates: [{templateName: golden-signals-canary, clusterScope: true}]
          args: &analysisArgs
            - {name: service, value: obs-onboarding-controller}
            - {name: namespace, value: observability-prod}
            - {name: availabilityTarget, value: "0.999"}
            - {name: latencyTargetSeconds, value: "0.300"}
      - {setWeight: 25}
      - {pause: {duration: 15m}}
      - analysis: {templates: [{templateName: golden-signals-canary, clusterScope: true}], args: *analysisArgs}
      - {setWeight: 50}
      - {pause: {duration: 20m}}
      - analysis: {templates: [{templateName: golden-signals-canary, clusterScope: true}], args: *analysisArgs}
      - {setWeight: 100}
  rollbackWindow: {revisions: 3}
podDisruptionBudget: {enabled: true, minAvailable: 2}

