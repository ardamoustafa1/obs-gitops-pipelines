replicaCount: 2
image:
  repository: ghcr.io/acme/obs-onboarding-controller
  tag: 1.0.0
  pullPolicy: IfNotPresent
existingSecret: obs-onboarding-controller
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
rollout:
  enabled: true
  strategy: canary
  canary:
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - setWeight: 10
      - pause: {duration: 2m}
      - analysis:
          templates: [{templateName: golden-signals-canary, clusterScope: true}]
          args: &analysisArgs
            - {name: service, value: obs-onboarding-controller}
            - {name: namespace, value: observability-dev}
            - {name: availabilityTarget, value: "0.990"}
            - {name: latencyTargetSeconds, value: "0.500"}
      - setWeight: 50
      - pause: {duration: 5m}
      - analysis: {templates: [{templateName: golden-signals-canary, clusterScope: true}], args: *analysisArgs}
      - setWeight: 100
  rollbackWindow: {revisions: 3}
podDisruptionBudget: {enabled: true, minAvailable: 1}

