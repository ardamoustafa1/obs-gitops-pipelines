apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-prod
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: observability
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        replicaCount: 2
        webhook: {replicaCount: 2}
        certController: {replicaCount: 2}
        serviceAccount: {create: true, name: external-secrets}
  destination: {name: obs-prod, namespace: external-secrets}
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true, PruneLast=true]
