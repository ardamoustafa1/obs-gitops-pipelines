apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-prod
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/ardamoustafa1/obs-gitops-pipelines.git
    targetRevision: main
    path: applications/prod
    directory: {recurse: true}
  destination: {server: "https://kubernetes.default.svc", namespace: argocd}
  syncPolicy:
    automated: {enabled: true, prune: true, selfHeal: true, allowEmpty: false}
    syncOptions: [ServerSideApply=true, PruneLast=true]
    retry:
      limit: 3
      backoff: {duration: 10s, factor: 2, maxDuration: 5m}
